name: Data Contract Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-data-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Data Contract CLI
        run: |
          uv tool install --python 3.11 --upgrade 'datacontract-cli[all]'
          uv pip install --system pyyaml
      
      - name: Check for breaking schema changes
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import yaml

          # Get previous contract from main
          previous_yaml = subprocess.check_output(
              ["git", "show", "origin/main:data-contract.yaml"]
          )

          previous = yaml.safe_load(previous_yaml)

          # Read current PR contract
          with open("data-contract.yaml") as f:
              current = yaml.safe_load(f)

          # Get table from schema
          previous_table = previous["schema"][0]
          current_table = current["schema"][0]

          # Get columns from properties
          previous_fields = {
              field["name"]: field
              for field in previous_table.get("properties", [])
          }

          current_fields = {
              field["name"]: field
              for field in current_table.get("properties", [])
          }

          errors = []

          # Check for removed fields
          for field_name in previous_fields:
              if field_name not in current_fields:
                  errors.append(f"Field removed: {field_name}")

          # Check for physical type changes
          for field_name in previous_fields:
              if field_name in current_fields:
                  old_type = previous_fields[field_name].get("physicalType")
                  new_type = current_fields[field_name].get("physicalType")

                  if old_type != new_type:
                      errors.append(
                          f"Physical type changed for {field_name}: "
                          f"{old_type} -> {new_type}"
                      )

          # Check optional -> required
          for field_name in previous_fields:
              if field_name in current_fields:
                  old_required = previous_fields[field_name].get("required", False)
                  new_required = current_fields[field_name].get("required", False)

                  if not old_required and new_required:
                      errors.append(
                          f"Field changed from optional to required: {field_name}"
                      )

          if errors:
              print("❌ Breaking schema changes detected:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          print("✅ No breaking schema changes detected.")
          PY
      

      - name: Lint data contract
        run: |
          datacontract lint data-contract.yaml

      - name: Test data contract
        env:
          DATACONTRACT_POSTGRES_USERNAME: ${{ secrets.DATACONTRACT_POSTGRES_USERNAME }}
          DATACONTRACT_POSTGRES_PASSWORD: ${{ secrets.DATACONTRACT_POSTGRES_PASSWORD }}
        run: |
          datacontract test data-contract.yaml