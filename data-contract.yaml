  logicalType: "object"
  physicalType: "application/x-ibm-rel-table"
  quality:
  - query: "SELECT COUNT(*)\n    FROM (\n        SELECT MAX(ingestion_time) AS latest_ingestion\n\
      \        FROM ontario_data.\"EMPLOYEE_SALARY_DISCLOSURE_2025\"\n    ) t\n  \
      \  WHERE latest_ingestion < NOW() - INTERVAL '24 HOURS';"
    type: "sql"
    description: "Ensures the dataset has been refreshed within the last 24 hours."
    mustBe: 0
    name: "Dataset Freshness < 24 Hours"
